[project]
name = "cvtool"
version = "0.1.0"
description = "지원자 CV 분석 툴 (온프레미스, 로컬 LLM 사용). 인사 RAG 시스템과 분리 운영."
requires-python = ">=3.11"

# requirements.txt 와 같은 내용입니다. 폐쇄망에서는 requirements.txt 를 쓰세요.
# 웹/엑셀/저장소는 표준 라이브러리만 쓰므로 FastAPI·openpyxl·psycopg·qdrant-client 는
# 필요 없습니다. 설치가 막힐 위험을 줄이려고 일부러 그렇게 만들었습니다.
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# 파일 형식별. 해당 형식을 안 쓰면 없어도 됩니다 (lazy import).
pdf = ["pypdf>=4.0"]        # layout 모드에는 4.0 이상이 필요
docx = ["python-docx>=1.1"]
all = ["pypdf>=4.0", "python-docx>=1.1"]
dev = ["pypdf>=4.0", "python-docx>=1.1", "pytest>=8.0"]

[project.scripts]
cvtool = "cvtool.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cvtool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
